# Static Astro build: German at /, English at /en/.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 requires Node 22.12 or newer.
  NODE_VERSION = "22"

# Astro fingerprints everything under /_astro/, so it can be cached for good.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
